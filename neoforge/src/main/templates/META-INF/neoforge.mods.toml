license="${mod_license}"
issueTrackerURL="https://github.com/Rianpls/CopyPasteBooks/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
displayTest="IGNORE_ALL_VERSION"
description='''
Copy books out to text files or the clipboard and paste text into books.
Page ranges, volumes for 100+ page texts, formatting-aware copying.
'''

[[mixins]]
config="${mod_id}.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_range}"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_range}"
ordering="NONE"
side="CLIENT"
