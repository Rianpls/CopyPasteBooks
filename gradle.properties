# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
# Mod
mod_id=copypastebooks
mod_name=CopyPasteBooks
mod_version=1.0.1
maven_group=io.github.rianpls.copypastebooks
mod_license=MIT

# Minecraft: single jar targets 26.1..26.2
minecraft_version=26.2
minecraft_range_fabric=>=26.1 <26.3
minecraft_range_neoforge=[26.1,26.3)

# Fabric
loom_version=1.17.19
loader_version=0.19.3
fabric_api_version=0.156.0+26.2
modmenu_version=20.0.1

# NeoForge
moddev_version=2.0.143
neo_version=26.2.0.53-beta
neo_range=[26.1,26.3)

# Secondary compile check against the 26.1 line (-PcompatCheck=true)
minecraft_version_compat=26.1.2
fabric_api_version_compat=0.155.2+26.1.2
neo_version_compat=26.1.2.94
